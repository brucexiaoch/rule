# 规则匹配（已修正为 Meta 内核标准的合规语法，杜绝报错）
rules:
  # ==================== 写死防御 WebRTC 泄漏 ====================
  - AND,((NETWORK,UDP),(DST-PORT,3478)),🚀 默认代理
  - AND,((NETWORK,UDP),(DST-PORT,19302)),🚀 默认代理
  - DST-PORT,3478,🚀 默认代理
  - DST-PORT,19302,🚀 默认代理
  # ==============================================================

  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ai_domain,🤖 AI
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 Wallet
  - RULE-SET,binance_domain,💶 Wallet
  - RULE-SET,okx_domain,💶 Wallet
  - RULE-SET,usd_domain,💶 Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,🎮 Steam
  - RULE-SET,cn!_domain,🚀 默认代理
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,apple_ip,🍎 Apple
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,netflix_ip,🎥 NETFLIX
  - RULE-SET,cn_ip,DIRECT
  - MATCH,🐟 漏网之鱼

# 规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

